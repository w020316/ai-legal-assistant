# 生产环境配置
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      username: ${REDIS_USERNAME:}
      timeout: 5000ms
      # Upstash Redis 强制 TLS：明文 6379 会被直接拒连 → 黑名单 fail-open，令牌吊销失效（v1.17.1/v1.18）。
      # 注意：Spring Boot 3.1+ 把 spring.data.redis.ssl 由布尔改为嵌套对象，必须用 ssl.enabled（此前误用布尔导致启动绑定失败）。
      # 默认 false 以兼容 docker-compose.prod.yml 内置 redis（无 TLS）；Render 使用 Upstash 时
      # 必须设置环境变量 REDIS_SSL=true（如需用户名认证再配 REDIS_USERNAME=default）。
      ssl:
        enabled: ${REDIS_SSL:false}

# 生产环境关闭 Swagger，避免接口结构泄露
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# v1.18（审查 P2#19）：生产关闭 SQL 全量日志——application.yml 的 StdOutImpl 会把所有 SQL
# 及参数（用户名、bcrypt 哈希等）打进 Render 日志面板
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.lawai.legalassistant: info
    root: warn
  file:
    name: logs/lawai.log
