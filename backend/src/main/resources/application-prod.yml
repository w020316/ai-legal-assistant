# 生产环境配置
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 5000ms
      # Upstash Redis 强制 TLS (v1.17.0 P1 修复): 缺该开关连接必然失败,
      # 触发 JWT 黑名单 fail-open, 导致登出/刷新吊销失效. Upstash 时须设 REDIS_SSL=true.
      ssl: ${REDIS_SSL:false}

# 生产环境关闭 Swagger，避免接口结构泄露
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.lawai.legalassistant: info
    root: warn
  file:
    name: logs/lawai.log
