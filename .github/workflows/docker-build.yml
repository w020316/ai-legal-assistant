name: Build and Push Docker Images

# 触发条件：master 分支推送（backend/frontend/init/postgres 有改动）或手动触发
on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'init/**'
      - 'postgres/Dockerfile'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # PostgreSQL + pgvector + 初始化脚本
          - image: lawai-postgres
            context: .
            dockerfile: postgres/Dockerfile
          # Spring Boot 后端
          - image: lawai-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          # Vue3 + Nginx 前端
          - image: lawai-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # v1.18：后端镜像推送后触发 Render Deploy Hook，消除"GHCR 镜像已更新、Render 仍跑旧版"的双轨漂移
      #（v1.17 已实证：docker-build success 但 Render 未见重部署）。Hook URL 在 Render Dashboard
      # → Settings → Deploy Hook 创建后存入 GitHub Secrets 的 RENDER_DEPLOY_HOOK_URL；未配置时优雅跳过。
      - name: Trigger Render deploy (backend only)
        if: matrix.image == 'lawai-backend'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL 未配置，跳过 Render 自动部署（请在 Render Dashboard 创建 Deploy Hook 并存入 GitHub Secrets）"
          else
            for i in 1 2 3; do
              curl -sf -X POST "$RENDER_DEPLOY_HOOK_URL" && { echo "Render deploy triggered"; break; } || { echo "attempt $i failed, retry in 5s"; sleep 5; }
            done
          fi

      - name: Set package visibility to public
        continue-on-error: true
        run: |
          sleep 5
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${{ matrix.image }}" \
            -d '{"visibility":"public"}' || true
