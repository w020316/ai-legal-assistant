name: Deploy Frontend to Cloudflare Pages (Git-driven)

# 目标：改代码 → push master → 自动构建并部署前端到 Cloudflare Pages（取代手动上传）。
# 依赖两个 GitHub Secrets（需仓库 Settings → Secrets and variables → Actions 添加）：
#   CLOUDFLARE_API_TOKEN  — 具有 "Cloudflare Pages:Edit" 权限的 API Token
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare 账户 ID（dash.cloudflare.com 首页右下角可查）
# 后端由 Render 的 GitHub 集成在 push master 时自动重新部署，无需本 workflow。

on:
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages (wrangler)
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=lawai-frontend --branch=main --commit-dirty=true