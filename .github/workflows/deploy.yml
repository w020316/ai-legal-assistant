name: Deploy to Fly.io (legacy)

# 历史遗留：项目已从 Fly.io 迁移至「Render(后端) + Cloudflare Pages(前端)」免费方案
# （见 deploy/README.md）。Render 的 GitHub 集成与 Cloudflare Pages Git 构建会分别在
# master 分支推送时自动部署，无需本 workflow 自动触发。
# 本 workflow 仅保留 workflow_dispatch 手动触发入口，供需要时手动推送到历史 Fly 实例。
on:
  workflow_dispatch:

jobs:
  # ============ 前端部署 ============
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 flyctl
        run: curl -L https://fly.io/install.sh | sh

      - name: 部署前端到 Fly.io
        run: ~/.fly/bin/flyctl deploy ./frontend --app lawai-frontend --dockerfile ./frontend/Dockerfile.fly --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ============ 后端部署 ============
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 flyctl
        run: curl -L https://fly.io/install.sh | sh

      - name: 部署后端到 Fly.io
        run: ~/.fly/bin/flyctl deploy ./backend --app lawai-backend --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
